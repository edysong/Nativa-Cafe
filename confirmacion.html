<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pedido confirmado — Café Nativo</title>
  <meta name="description" content="Tu pedido en Café Nativo ha sido confirmado.">
  <link rel="stylesheet" href="css/styles.css">
  <script>tailwind.config={corePlugins:{preflight:false}}</script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>

<div class="topbar">Pedidos por WhatsApp &nbsp;·&nbsp; Bolsas de 250 g y 500 g</div>

<header class="site-header">
  <div class="container header-inner">
    <a href="index.html" class="header-logo">
      <span>NATIVO</span>
      <span class="logo-sub">EL ORIGEN DE TU CAFÉ</span>
    </a>
  </div>
</header>

<main class="confirmacion-page">
  <div class="container" style="max-width:760px;">

    <div class="confirmacion-icono" aria-hidden="true">
      <svg width="40" height="40" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
      </svg>
    </div>

    <h1 style="font-size:clamp(1.5rem,3vw,2.2rem);text-align:center;">¡Pedido confirmado!</h1>
    <p style="text-align:center;margin:.5rem auto 0;">Gracias por tu compra. Recibirás un resumen en tu correo.</p>

    <div style="text-align:center;">
      <div class="numero-pedido" id="numeroPedido" aria-live="polite">NAT-XXXXXXXX-XXXX</div>
    </div>

    <div class="confirmacion-grid" id="confirmacionGrid">
      <!-- Se llena con JS -->
    </div>

    <!-- Productos comprados -->
    <div style="background:var(--crema-light);border:1px solid var(--borde);border-radius:var(--radio);padding:1.5rem;margin-bottom:1.5rem;" id="confirmacionProductos">
    </div>

    <div style="text-align:center;display:flex;flex-wrap:wrap;gap:.75rem;justify-content:center;">
      <a href="tienda.html" class="btn btn-primary btn-lg">Seguir comprando</a>
      <a href="mis-pedidos.html" class="btn btn-outline btn-lg">Ver mis pedidos</a>
    </div>

  </div>
</main>

<footer class="site-footer">
  <div class="container">
    <div class="footer-bottom" style="border-top:none;padding-top:0;">
      <span>© 2024 Café Nativo</span>
      <span>Proyecto académico — sin cobros reales</span>
    </div>
  </div>
</footer>

<script src="js/productos.js"></script>
<script src="js/app.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  const pedido = JSON.parse(localStorage.getItem('nativo_ultimo_pedido') || 'null');

  if (!pedido) {
    document.getElementById('confirmacionGrid').innerHTML = '<p style="text-align:center;color:var(--texto-suave);">No se encontró información del pedido.</p>';
    return;
  }

  document.getElementById('numeroPedido').textContent = pedido.numero;

  const fecha = new Date(pedido.fecha).toLocaleDateString('es-CO', {
    year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit'
  });

  const env = pedido.envio || {};

  document.getElementById('confirmacionGrid').innerHTML = `
    <div class="confirmacion-bloque">
      <h4>DATOS DE ENVÍO</h4>
      <p><strong>${env.nombre || '—'}</strong><br>
      ${env.direccion || ''}, ${env.barrio || ''}<br>
      ${env.ciudad || ''}, ${env.departamento || ''}<br>
      ${env.celular || ''}</p>
    </div>
    <div class="confirmacion-bloque">
      <h4>MÉTODO DE PAGO</h4>
      <p>${pedido.pago || '—'}</p>
      <p style="margin-top:.5rem;">Fecha: ${fecha}</p>
      <p style="margin-top:.5rem;font-weight:600;color:var(--cafe);">Total: ${formatPrecio(pedido.total)}</p>
    </div>`;

  if (pedido.items && pedido.items.length) {
    document.getElementById('confirmacionProductos').innerHTML = `
      <h4 style="font-size:.78rem;letter-spacing:.1em;color:var(--dorado);margin-bottom:1rem;">PRODUCTOS</h4>
      ${pedido.items.map(it => `
        <div style="display:flex;justify-content:space-between;font-size:.88rem;padding:.35rem 0;border-bottom:1px solid var(--borde);">
          <span>${it.nombre} (${it.size}, ${it.tueste}) ×${it.cantidad}</span>
          <span style="font-weight:600;">${formatPrecio(it.precio * it.cantidad)}</span>
        </div>`).join('')}
      <div style="display:flex;justify-content:space-between;font-size:1rem;font-weight:700;color:var(--verde);margin-top:.75rem;">
        <span>Total</span><span>${formatPrecio(pedido.total)}</span>
      </div>`;
  }
});
</script>
</body>
</html>
